<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Arquitetura Moderna</title>
</head>
<body>
    <header>
        <h1> ArquiDesign</h1>
        <nav>
            <ul>
                <li><a href="#coca_cola">Coca cola</a></li>
                <li><a href="#pepsi">Pepsi</a></li>
                <li><a href="#quipo">Quipo</a></li>   
            </ul>
        </nav>
    </header>
    <main>
        <section id="coca_cola">
            <h2>Zero açúcar</h2>
            <div class="imagens">
            <img src="img/coca-lata.png" alt="Coca-cola-lata">
            <img src="img/coca-garrafa.jpg" alt="Coca-cola-garrafa">
            <img src="img/Coca-zero-litro.png" alt="Coca-cola-litro">
            </div>
            <p>A mais saborosa de todas as bebidas.</p>
        </section>
        <section id="pepsi">
            <h2>Doce Doce</h2>
            <div class="imagens">
            <img src="img/pepsi-lata.jpg" alt="Pepsi-lata">
            <img src="img/pepsi-garrafa.webp" alt="Pepsi-garrafa">
            <img src="img/pepsi-litro.jpg" alt="Pepsi-litro">
            </div>
            <p>Essa sim é doce que nem melado chega colar as tripa.</p>
        </section>
        <section id="quipo">
            <h3>Xarope Quipo</h3>
            <div class="imagens">
            <img src="img/quipo-framboesa.png" alt="Quipo-framboesa">
            <img src="img/quipo-guarana.png" alt="Quipo-guarana">
            <img src="img/quipo-laranjinha.png" alt="Quipo-laranja">
            </div>
            <p>Sabor do tipo xarope inesquecível.</p>
        </section>
    </main>
    
</body>
</html>
